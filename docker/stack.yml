version: "3.9"

services:
  app:
    image: ${REGISTRY}/skatedreams:${TAG:-latest}
    environment:
      DATABASE_URL: postgres://skatedreams:${POSTGRES_PASSWORD}@postgres:5432/skatedreams
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      SESSION_SECRET: ${SESSION_SECRET}
      SEED_EMAIL: ${SEED_EMAIL}
      SEED_PASSWORD: ${SEED_PASSWORD}
      GOOGLE_SERVICE_ACCOUNT_KEY_PATH: /run/secrets/google_sa_key
      GOOGLE_CALENDAR_ID: ${GOOGLE_CALENDAR_ID}
      NODE_ENV: production
    secrets:
      - google_sa_key
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=network_swarm_public"
        - "traefik.http.routers.skatedreams.rule=Host(`${APP_HOST}`)"
        - "traefik.http.routers.skatedreams.entrypoints=websecure"
        - "traefik.http.routers.skatedreams.tls=true"
        - "traefik.http.routers.skatedreams.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}"
        - "traefik.http.services.skatedreams.loadbalancer.server.port=3000"
    networks: [internal, network_swarm_public]
    depends_on: [postgres]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: skatedreams
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: skatedreams
    volumes:
      - skatedreams_pg:/var/lib/postgresql/data
    deploy:
      replicas: 1
    networks: [internal]

volumes:
  skatedreams_pg:

networks:
  internal:
  network_swarm_public:
    external: true
    name: network_swarm_public

secrets:
  google_sa_key:
    external: true
