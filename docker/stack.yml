version: "3.9"

services:
  app:
    image: ${REGISTRY}/skatedreams:${TAG:-latest}
    environment:
      DATABASE_URL: postgres://skatedreams:${POSTGRES_PASSWORD}@postgres:5432/skatedreams
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      SESSION_SECRET: ${SESSION_SECRET}
      SEED_EMAIL: ${SEED_EMAIL}
      SEED_PASSWORD: ${SEED_PASSWORD}
      GOOGLE_SERVICE_ACCOUNT_KEY_PATH: /run/secrets/google_sa_key
      GOOGLE_CALENDAR_ID: ${GOOGLE_CALENDAR_ID}
      NODE_ENV: production
    secrets:
      - google_sa_key
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
    networks: [internal, edge]
    depends_on: [postgres]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: skatedreams
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: skatedreams
    volumes:
      - skatedreams_pg:/var/lib/postgresql/data
    deploy:
      replicas: 1
    networks: [internal]

volumes:
  skatedreams_pg:

networks:
  internal:
  edge:
    external: true

secrets:
  google_sa_key:
    external: true
